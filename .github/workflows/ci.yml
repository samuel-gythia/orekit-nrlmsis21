name: Build & Test orekit-nrlmsis21 Wrapper

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  wrapper-packaging-and-tests:
    name: ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.11", "3.12" ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "setuptools>=77.0" wheel numpy jpype1 orekit-jpype pytest

      - name: Compile Java adapter (javac --release 17)
        shell: bash
        run: |
          mkdir -p target/classes python/orekit_nrlmsis21/lib
          OREKIT_CP=$(python -c "import orekit_jpype, os, pathlib; jars = list(pathlib.Path(orekit_jpype.__file__).parent.rglob('*.jar')); print(os.pathsep.join(str(j.resolve()) for j in jars))")
          javac --release 17 -cp "$OREKIT_CP" -d target/classes java/src/main/java/org/ssa/nrlmsis21/*.java
          jar cf target/orekit-nrlmsis21-1.0.2.jar -C target/classes .
          cp target/orekit-nrlmsis21-1.0.2.jar python/orekit_nrlmsis21/lib/orekit-nrlmsis21-1.0.2.jar

      - name: Build wrapper-only wheel and source distribution
        shell: bash
        env:
          OREKIT_NRLMSIS21_WRAPPER_ONLY: "1"
        run: |
          python setup.py bdist_wheel sdist

      - name: Verify wrapper-only distribution excludes upstream NRL files
        shell: bash
        run: |
          python -c "
          import zipfile, tarfile, glob
          allowed_f90 = ('_native_src/native/nrlmsis21_c_api.f90',)
          whl = glob.glob('dist/*-py3-none-any.whl')[0]
          with zipfile.ZipFile(whl) as zf:
              for n in zf.namelist():
                  nl = n.lower()
                  if nl.endswith('.f90'):
                      assert nl.endswith(allowed_f90), f'Unexpected .F90 in wheel: {n}'
                  assert not nl.endswith(('.parm', '.dll')) and '.so' not in nl, n
          sdist = glob.glob('dist/*.tar.gz')[0]
          with tarfile.open(sdist, 'r:gz') as tf:
              for m in tf.getmembers():
                  ml = m.name.lower()
                  assert '/external/' not in ml and not ml.endswith(('.parm', '.dll')) and '.so' not in ml, m.name
          print('Verified wrapper-only wheel and sdist contents.')
          "

      - name: Run wrapper loader and acquisition tests
        shell: bash
        run: |
          python -m pytest tests/test_user_supplied_source_and_loader.py -v

      - name: Upload wrapper artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*
