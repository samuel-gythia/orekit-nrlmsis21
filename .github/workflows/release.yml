name: Build Wrapper-Only Release Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-wrapper:
    name: Build Wrapper-Only Wheel, Sdist & Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel numpy jpype1 orekit-jpype pytest

      - name: Compile Java adapter (javac --release 17)
        run: |
          mkdir -p target/classes python/orekit_nrlmsis21/lib
          OREKIT_CP=$(python -c "import orekit_jpype, os, pathlib; jars = list(pathlib.Path(orekit_jpype.__file__).parent.rglob('*.jar')); print(os.pathsep.join(str(j.resolve()) for j in jars))")
          javac --release 17 -cp "$OREKIT_CP" -d target/classes java/src/main/java/org/ssa/nrlmsis21/*.java
          jar cf target/orekit-nrlmsis21-1.0.2.jar -C target/classes .
          cp target/orekit-nrlmsis21-1.0.2.jar python/orekit_nrlmsis21/lib/orekit-nrlmsis21-1.0.2.jar

      - name: Build wrapper-only wheel and source distribution
        env:
          OREKIT_NRLMSIS21_WRAPPER_ONLY: "1"
        run: |
          python setup.py bdist_wheel sdist

      - name: Verify wrapper-only distributions exclude upstream NRL files
        run: |
          python -c "
          import zipfile, tarfile, glob
          whl = glob.glob('dist/*-py3-none-any.whl')[0]
          with zipfile.ZipFile(whl) as zf:
              for n in zf.namelist():
                  assert not n.lower().endswith(('.f90', '.parm', '.dll')) and '.so' not in n.lower(), n
          sdist = glob.glob('dist/*.tar.gz')[0]
          with tarfile.open(sdist, 'r:gz') as tf:
              for m in tf.getmembers():
                  assert '/external/' not in m.name and not m.name.lower().endswith(('.parm', '.dll')) and '.so' not in m.name.lower(), m.name
          print('Verified wrapper-only release assets.')
          "

      - name: Run wrapper tests
        run: |
          python -m pytest tests/test_user_supplied_source_and_loader.py -v

      - name: Generate SHA256SUMS.txt
        run: |
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-release-v1.0.2
          path: dist/*

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
