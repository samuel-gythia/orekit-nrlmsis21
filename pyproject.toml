[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orekit-nrlmsis21"
version = "1.0.2"
description = "NRLMSIS 2.1 Orekit-JPype integration (mixed Apache-2.0 wrapper / NRL-SOF-014-1 academic-research model; non-commercial use only)"
readme = "README.md"
requires-python = ">=3.10"
# Mixed-license distribution: independently authored Python/Java wrapper code is Apache-2.0,
# while native integration components and user-supplied NRLMSIS 2.1 are governed by
# NRL-SOF-014-1 (non-commercial research, academic, and non-profit use only).
# This software incorporates the MSIS® empirical atmospheric model software designed and provided by NRL. Use is governed by the Open Source Academic Research License Agreement contained in the file nrlmsis2.1_license.txt.
license-files = [
    "LICENSE",
    "NOTICE",
    "THIRD_PARTY_NOTICES.md",
    "LICENSES/APACHE-2.0.txt",
    "LICENSES/NRL-SOF-014-1.txt",
    "LICENSES/README.md",
    "python/orekit_nrlmsis21/nrlmsis2.1_license.txt",
]
authors = [
    { name = "orekit-nrlmsis21 Contributors" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux"
]
dependencies = [
    "orekit-jpype>=12.0",
    "jpype1>=1.4",
    "numpy>=1.20"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "matplotlib>=3.5"
]

[project.urls]
Homepage = "https://github.com/samuel-gythia/orekit-nrlmsis21"
Repository = "https://github.com/samuel-gythia/orekit-nrlmsis21"

[tool.setuptools]
include-package-data = false
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
